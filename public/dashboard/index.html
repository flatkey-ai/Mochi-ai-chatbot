<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Mochi · Dashboard</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍡</text></svg>" />
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div id="login" class="login hidden">
  <form id="login-form" class="card login-card">
    <div class="logo-big">🍡</div>
    <h1>Mochi dashboard</h1>
    <p class="muted">Enter the <code>ADMIN_TOKEN</code> from your <code>.env</code>.</p>
    <input id="token" type="password" placeholder="Admin token" autocomplete="current-password" required />
    <button class="btn primary" type="submit">Unlock</button>
    <p id="login-error" class="error"></p>
  </form>
</div>

<div id="app" class="layout hidden">
  <aside class="sidebar">
    <div class="brand"><span class="logo">🍡</span><div><b>Mochi</b><small>AI chatbots on flatkey</small></div></div>
    <nav id="nav">
      <a href="#bots" data-nav="bots">🤖 Bots</a>
      <div id="nav-bots" class="nav-bots"></div>
      <a href="#flatkey" data-nav="flatkey">🔑 Flatkey API key <span id="nav-key-dot" class="dot"></span></a>
      <a href="#usage" data-nav="usage">📊 Usage &amp; cost</a>
    </nav>
    <a class="fk-badge" href="https://flatkey.ai/?utm_source=mochi_bot&utm_medium=dashboard&utm_campaign=mochi&utm_content=sidebar_badge" target="_blank" rel="noopener"><b>flatkey</b><small>Official models. Better prices.</small></a>
    <button id="logout" class="btn ghost small">Log out</button>
  </aside>
  <main id="view"></main>
</div>

<div id="modal" class="modal hidden" role="dialog" aria-modal="true"><div class="modal-card card" id="modal-body"></div></div>
<div id="toast" class="toast"></div>
<datalist id="model-list"></datalist>
<script src="app.js"></script>
</body>
</html>
