<!doctype html>
<html lang="en">
<head><meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" /><title>Mochi widget demo</title>
<style>body{font-family:system-ui,sans-serif;max-width:640px;margin:60px auto;padding:0 20px;color:#2a2233;line-height:1.6}pre{background:#f6f0f5;padding:12px;border-radius:10px;white-space:pre-wrap;word-break:break-all}</style></head>
<body>
<h1>Widget demo 🍡</h1>
<p>This page stands in for your website. The chat bubble in the bottom-right corner is your bot.</p>
<p>Embed it on any page with one line (copy yours from the dashboard → your bot → Channels):</p>
<pre id="snippet"></pre>
<script>
  // Load the widget for ?bot=<id> (defaults to your first bot).
  var qs = new URLSearchParams(location.search);
  var bot = qs.get("bot") || "";
  var s = document.createElement("script");
  s.src = "/widget/widget.js";
  s.defer = true;
  s.setAttribute("data-server", location.origin);
  if (bot) s.setAttribute("data-bot", bot);
  if (qs.get("lang")) s.setAttribute("data-lang", qs.get("lang"));
  document.body.appendChild(s);
  document.getElementById("snippet").textContent =
    '<script src="' + location.origin + '/widget/widget.js" data-server="' + location.origin + '"' + (bot ? ' data-bot="' + bot + '"' : "") + ' defer></' + "script>";
</script>
</body>
</html>
