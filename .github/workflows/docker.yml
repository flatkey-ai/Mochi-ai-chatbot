name: docker

# Builds the container image and publishes it to GitHub Container Registry.
#
#   push to main / a tag  → ghcr.io/<owner>/mochi:{latest,sha-xxxxxxx}  (tag also gets semver)
#   pull request          → build only, no push (proves the Dockerfile still works)
#   manual                → same as a branch push
#
# The image is what Sealos / Zeabur / Railway / Fly.io / a plain `docker run` pull from, so it
# has to exist before any "one-click deploy" button can work.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  # Package names on GHCR must be lowercase: the owner may not be.
  IMAGE: ghcr.io/${{ github.repository_owner }}/mochi

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # amd64 covers Sealos / Railway / Render / Fly / any VPS; arm64 covers Apple Silicon and
      # ARM instances (Oracle free tier, Hetzner CAX). QEMU makes the arm64 half possible.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: Summary
        run: |
          {
            echo "### Mochi image"
            echo ""
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo ""
            echo "Pull: \`docker pull ${{ env.IMAGE }}:latest\`"
          } >> "$GITHUB_STEP_SUMMARY"
