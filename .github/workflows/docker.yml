name: docker

# Builds the container image and publishes it to one or more registries.
#
#   push to main / a tag  → :latest (+ :sha-<short>, semver on v* tags)
#   pull request          → build only, never pushes
#   manual                → same as a branch push
#
# GHCR first: ghcr.io/<owner>/mochi. Org-owned packages can be locked to private by an
# organisation policy (flatkey-ai currently does this), in which case add ONE of these secrets
# and the workflow also publishes somewhere publicly pullable:
#
#   DOCKERHUB_USERNAME + DOCKERHUB_TOKEN   → docker.io/<user>/mochi:latest   (public by default)
#   GHCR_PAT_USERNAME + GHCR_PAT           → ghcr.io/<user>/mochi:latest     (personal namespace)
#
# Those extra steps are skipped when the secrets are absent, so the workflow never fails for
# lack of them.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/mochi

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # amd64 covers Sealos / Railway / Render / Fly / any VPS; arm64 covers Apple Silicon and
      # ARM instances (Oracle free tier, Hetzner CAX).
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub (optional)
        if: github.event_name != 'pull_request' && secrets.DOCKERHUB_TOKEN != ''
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GHCR under a personal account (optional)
        if: github.event_name != 'pull_request' && secrets.GHCR_PAT != ''
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_PAT_USERNAME }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.IMAGE }}
            ${{ secrets.DOCKERHUB_USERNAME != '' && format('docker.io/{0}/mochi', secrets.DOCKERHUB_USERNAME) || '' }}
            ${{ secrets.GHCR_PAT_USERNAME != '' && format('ghcr.io/{0}/mochi', secrets.GHCR_PAT_USERNAME) || '' }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: Summary
        run: |
          {
            echo "### Mochi image"
            echo ""
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
