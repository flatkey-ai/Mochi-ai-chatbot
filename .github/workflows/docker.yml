name: docker

# Builds the container image and publishes it to one or more registries.
#
#   push to main / a tag  → :latest (+ :sha-<short>, semver on v* tags)
#   pull request          → build only, never pushes
#   manual                → same as a branch push
#
# GHCR first: ghcr.io/<owner>/mochi. Org-owned packages can be locked to private by an
# organisation policy (flatkey-ai currently is), in which case adding ONE pair of secrets makes
# the workflow also publish somewhere publicly pullable:
#
#   DOCKERHUB_USERNAME + DOCKERHUB_TOKEN   → docker.io/<user>/mochi:latest   (public by default)
#   GHCR_PAT_USERNAME + GHCR_PAT           → ghcr.io/<user>/mochi:latest     (personal namespace)
#
# Those steps are skipped when the secrets are absent. Note that the `secrets` context is not
# allowed in `if:` — hence the env-based detection step below.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  GHCR_IMAGE: ghcr.io/${{ github.repository_owner }}/mochi

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Which registries are configured
        id: reg
        env:
          DH_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          DH_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          PU_USER: ${{ secrets.GHCR_PAT_USERNAME }}
          PU_TOKEN: ${{ secrets.GHCR_PAT }}
        run: |
          list="$GHCR_IMAGE"
          if [ -n "$DH_TOKEN" ] && [ -n "$DH_USER" ]; then
            echo "dockerhub=true" >> "$GITHUB_OUTPUT"
            list="$list"$'\n'"docker.io/$DH_USER/mochi"
          fi
          if [ -n "$PU_TOKEN" ] && [ -n "$PU_USER" ]; then
            echo "personal=true" >> "$GITHUB_OUTPUT"
            list="$list"$'\n'"ghcr.io/$PU_USER/mochi"
          fi
          { echo "images<<EOF"; echo "$list"; echo "EOF"; } >> "$GITHUB_OUTPUT"
          echo "publishing to:"; echo "$list"

      # amd64 covers Sealos / Railway / Render / Fly / any VPS; arm64 covers Apple Silicon and
      # ARM instances (Oracle free tier, Hetzner CAX).
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR (org namespace)
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request' && steps.reg.outputs.dockerhub == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GHCR (personal namespace)
        if: github.event_name != 'pull_request' && steps.reg.outputs.personal == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_PAT_USERNAME }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.reg.outputs.images }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: Summary
        run: |
          {
            echo "### Mochi image"
            echo ""
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
